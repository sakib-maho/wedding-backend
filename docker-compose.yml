services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: wedding-db
    environment:
      POSTGRES_DB: wedding_db
      POSTGRES_USER: wedding_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_this_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wedding_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - wedding-network

  # Backend API Server
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wedding-backend
    environment:
      NODE_ENV: production
      PORT: 3001
      JWT_SECRET: ${JWT_SECRET:-change_this_jwt_secret}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: wedding_db
      DB_USER: wedding_user
      DB_PASSWORD: ${DB_PASSWORD:-change_this_password}
      DEFAULT_ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      DEFAULT_ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - wedding-network
    volumes:
      - ./logs:/app/logs

volumes:
  postgres_data:
    driver: local

networks:
  wedding-network:
    driver: bridge

